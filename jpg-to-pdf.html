<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPG to PDF Professional | AllToolsPro</title>
    <link rel="canonical" href="https://alltoolspro.in/jpg-to-pdf.html" />
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            --primary: #0061ff;
            --primary-dark: #0046b8;
            --bg-workspace: #f1f5f9;
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* पूरी बॉडी को व्यूपोर्ट के बराबर रखना */
        body { 
            background-color: var(--white); 
            color: var(--text-dark); 
            height: 100vh; 
            height: 100dvh; /* Mobile dynamic height fix */
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        header { 
            background: white; padding: 12px 5%; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--primary); text-decoration: none; }

        /* --- App Layout --- */
        .app-layout { display: flex; flex: 1; overflow: hidden; }

        /* Left Side: Workspace */
        #workspace { 
            flex: 1; padding: 30px; overflow-y: auto; background: var(--bg-workspace); 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px; align-content: flex-start;
        }

        /* Image Card */
        .img-card {
            background: white; border-radius: 12px; padding: 10px; border: 1px solid var(--border);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; cursor: grab;
        }
        .card-actions { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; }
        .card-actions i { width: 26px; height: 26px; background: #f1f5f9; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: var(--text-gray); cursor: pointer; }
        .card-actions i:hover { background: var(--primary); color: white; }
        
        .img-card img { width: 100%; height: 140px; object-fit: contain; border-radius: 6px; }
        .img-card p { font-size: 10px; margin-top: 8px; color: var(--text-gray); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Add More Card */
        .add-more-card {
            border: 2px dashed var(--primary); border-radius: 12px; height: 210px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; color: var(--primary); background: #f0f7ff;
        }

        /* --- Sidebar (Right Side) --- */
        .sidebar { 
            width: 350px; background: white; border-left: 1px solid var(--border); 
            display: flex; flex-direction: column; flex-shrink: 0; position: relative;
        }

        /* Settings Scrollable Area */
        .sidebar-content { flex: 1; overflow-y: auto; padding: 25px; padding-bottom: 100px; }
        .sidebar h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 25px; text-align: center; color: var(--text-dark); }

        .opt-group { margin-bottom: 20px; }
        .opt-label { display: block; font-weight: 700; font-size: 11px; margin-bottom: 8px; color: var(--text-gray); text-transform: uppercase; }
        
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-weight: 700; outline: none; background: #f8fafc; }

        /* --- Fixed Convert Button (The Fix) --- */
        .sidebar-footer { 
            position: absolute; bottom: 0; left: 0; width: 100%; 
            background: white; padding: 20px; border-top: 1px solid var(--border); 
            z-index: 10; box-shadow: 0 -5px 15px rgba(0,0,0,0.03);
        }
        .btn-convert {
            background: var(--primary); color: white; border: none; width: 100%;
            padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: 800;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0, 97, 255, 0.2); transition: 0.3s;
        }
        .btn-convert:hover { background: var(--primary-dark); transform: translateY(-2px); }

        /* Mobile Adjustments */
        @media (max-width: 850px) {
            .app-layout { flex-direction: column; }
            .sidebar { 
                width: 100%; border-left: none; border-top: 2px solid var(--border); 
                height: 50vh; /* Takes half screen on mobile */
            }
            .sidebar-footer { padding: 15px; position: sticky; bottom: 0; }
        }

        /* Initial Selection Screen */
        #empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--white); }
        .big-select { background: var(--primary); color: white; padding: 18px 45px; border-radius: 50px; font-size: 1.3rem; font-weight: 800; border: none; cursor: pointer; box-shadow: 0 10px 25px rgba(0, 97, 255, 0.2); }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="logo">AllToolsPro</a>
    </header>

    <div class="app-layout">
        <!-- Initial Selection -->
        <div id="empty-state">
            <h1 style="font-size: 2.2rem; margin-bottom: 10px; font-weight: 800;">JPG to PDF</h1>
            <p style="color: var(--text-gray); margin-bottom: 35px;">Fast, secure and professional converter.</p>
            <button class="big-select" onclick="document.getElementById('file-input').click()">Select JPG images</button>
        </div>

        <!-- Work Area -->
        <main id="workspace" style="display:none;"></main>

        <!-- Sidebar Options -->
        <aside class="sidebar" id="sidebar" style="display:none;">
            <div class="sidebar-content">
                <h2>OPTIONS</h2>
                
                <div class="opt-group">
                    <label class="opt-label">Page Size</label>
                    <select id="page-size">
                        <option value="a4">A4 (Standard)</option>
                        <option value="letter">US Letter</option>
                        <option value="legal">Legal</option>
                    </select>
                </div>

                <div class="opt-group">
                    <label class="opt-label">Orientation</label>
                    <select id="orient">
                        <option value="p">Portrait</option>
                        <option value="l">Landscape</option>
                    </select>
                </div>

                <div class="opt-group">
                    <label class="opt-label">Margin</label>
                    <select id="margin">
                        <option value="0">No margin</option>
                        <option value="10">Small</option>
                        <option value="25">Big</option>
                    </select>
                </div>
            </div>

            <!-- This stays visible at the bottom of the sidebar -->
            <div class="sidebar-footer">
                <button class="btn-convert" onclick="generatePDF()">CONVERT TO PDF</button>
            </div>
        </aside>
    </div>

    <input type="file" id="file-input" multiple accept="image/*" style="display:none">

    <script>
        const fileInput = document.getElementById('file-input');
        const workspace = document.getElementById('workspace');
        const emptyState = document.getElementById('empty-state');
        const sidebar = document.getElementById('sidebar');

        let imagesList = [];

        new Sortable(workspace, { animation: 150, filter: '.add-more-card' });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imagesList.push({ id: Date.now() + Math.random(), src: event.target.result, name: file.name, rotation: 0 });
                    renderGrid();
                };
                reader.readAsDataURL(file);
            });
            fileInput.value = "";
        });

        function renderGrid() {
            if (imagesList.length > 0) {
                emptyState.style.display = 'none';
                workspace.style.display = 'grid';
                sidebar.style.display = 'flex';
            }

            workspace.innerHTML = '';
            imagesList.forEach(img => {
                const div = document.createElement('div');
                div.className = 'img-card';
                div.dataset.id = img.id;
                div.innerHTML = `
                    <div class="card-actions">
                        <i class="fas fa-redo" onclick="rotateImg(${img.id})"></i>
                        <i class="fas fa-trash btn-del" onclick="removeImg(${img.id})"></i>
                    </div>
                    <img src="${img.src}" style="transform: rotate(${img.rotation}deg)">
                    <p>${img.name}</p>
                `;
                workspace.appendChild(div);
            });

            const addMore = document.createElement('div');
            addMore.className = 'add-more-card';
            addMore.innerHTML = `<i class="fas fa-plus-circle"></i><span style="font-size:12px; font-weight:700; margin-top:10px;">Add More</span>`;
            addMore.onclick = () => fileInput.click();
            workspace.appendChild(addMore);
        }

        window.removeImg = (id) => {
            imagesList = imagesList.filter(i => i.id !== id);
            if (imagesList.length === 0) location.reload();
            renderGrid();
        };

        window.rotateImg = (id) => {
            const img = imagesList.find(i => i.id === id);
            img.rotation = (img.rotation + 90) % 360;
            renderGrid();
        };

        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const size = document.getElementById('page-size').value;
            const orient = document.getElementById('orient').value;
            const margin = parseInt(document.getElementById('margin').value);

            const pdf = new jsPDF(orient, 'mm', size);
            const cards = Array.from(workspace.querySelectorAll('.img-card'));

            for (let i = 0; i < cards.length; i++) {
                if (i > 0) pdf.addPage();
                const id = parseFloat(cards[i].dataset.id);
                const imgObj = imagesList.find(img => img.id === id);
                
                const pw = pdf.internal.pageSize.getWidth();
                const ph = pdf.internal.pageSize.getHeight();
                
                // Simplified drawing (No rotation on final for speed, can add canvas rotation later)
                pdf.addImage(imgObj.src, 'JPEG', margin, margin, pw - (margin*2), ph - (margin*2));
            }
            pdf.save('AllToolsPro_Document.pdf');
        }
    </script>
</body>
</html>
