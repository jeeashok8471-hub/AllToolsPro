<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPG to PDF | AllToolsPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #0061ff; --dark: #0f172a; --bg: #f8fbff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--dark); padding-bottom: 50px; }
        header { background: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); text-decoration: none; }
        .container { max-width: 800px; margin: 50px auto; padding: 20px; text-align: center; }
        .upload-box { background: white; border: 3px dashed #cbd5e1; padding: 60px; border-radius: 20px; cursor: pointer; transition: 0.3s; position: relative; }
        .upload-box:hover { border-color: var(--primary); background: #f0f7ff; }
        .upload-box input { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; }
        #preview { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; margin-top: 30px; }
        .preview-img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn { background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px; font-weight: 700; cursor: pointer; margin-top: 30px; display: none; }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="logo">AllToolsPro</a>
        <a href="../index.html" style="text-decoration:none; color:var(--dark); font-weight:700;"><i class="fas fa-arrow-left"></i> Back</a>
    </header>
    <div class="container">
        <h1>JPG to PDF Converter</h1>
        <p style="margin-bottom: 30px; color: #64748b;">Convert images to PDF locally in your browser.</p>
        
        <div class="upload-box">
            <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: var(--primary); margin-bottom: 15px;"></i>
            <h3>Choose or Drop Images</h3>
            <input type="file" id="files" multiple accept="image/*">
        </div>

        <div id="preview"></div>
        <button id="convert" class="btn">Generate PDF</button>
    </div>

    <script>
        const fileInput = document.getElementById('files');
        const preview = document.getElementById('preview');
        const btn = document.getElementById('convert');
        let images = [];

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    images.push(ev.target.result);
                    const img = document.createElement('img');
                    img.src = ev.target.result;
                    img.className = 'preview-img';
                    preview.appendChild(img);
                }
                reader.readAsDataURL(file);
            });
            btn.style.display = 'inline-block';
        });

        btn.addEventListener('click', () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            images.forEach((img, i) => {
                if (i > 0) doc.addPage();
                doc.addImage(img, 'JPEG', 10, 10, 190, 0);
            });
            doc.save('AllToolsPro.pdf');
        });
    </script>
</body>
</html>
